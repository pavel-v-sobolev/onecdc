# Пример развёртывания. Целевой Postgres сюда не включён: база у вас своя.
#
# Переменные перечислены здесь, а не вынесены целиком в .env — чтобы настройка читалась одним
# экраном; справочник по ним — README_ENV.md.
#
# Пароль — исключение: он берётся из .env рядом (compose читает его сам). Заготовка — .env.example:
#   cp .env.example .env
# Остальные значения тоже можно вынести туда же через ${ПЕРЕМЕННАЯ}, если этот файл уезжает в git.
services:
  onecdc:
    image: sobolevp/onecdc:latest
    restart: unless-stopped

    environment:
      # --- обязательные ---------------------------------------------------------------------
      # Адрес OData-интерфейса опубликованной базы 1С (именно интерфейса, а не базы).
      ONECDC_ODATA_URL: "http://server/base/odata/standard.odata"
      # Имя плана обмена в 1С — то, что видно в конфигураторе.
      ONECDC_EXCHANGE_NAME: "ДляODATA"
      # Ref_Key узла обмена (очереди). Не знаете — оставьте пустым: в лог выведется список узлов.
      ONECDC_QUEUE_GUID: "a9bc23c5-3689-11f1-926c-0800270bc6cb"
      # Строка подключения SQLAlchemy к целевой БД. Postgres на хосте — см. network_mode ниже.
      ONECDC_DB_URL: "postgresql+psycopg2://user:pass@dbhost:5432/dwh"

      # --- необязательные -------------------------------------------------------------------
      # Пользователь OData. Не задан — запросы идут без авторизации.
      ONECDC_ODATA_USER: "odata"
      # Пароль — через ${…}: значение берётся из .env рядом (compose читает его сам) или из
      # окружения. Литерал здесь означал бы, что настройка делается правкой отслеживаемого файла,
      # а такая правка рано или поздно уезжает в коммит.
      ONECDC_ODATA_PASSWORD: "${ONECDC_ODATA_PASSWORD}"
      # Схема целевой БД. Не задана — схема по умолчанию (public у Postgres).
      ONECDC_DB_SCHEMA: "onecdc"
      # Куда класть одноразовые таблицы ключей полной выгрузки. Не задана — схема данных.
      # Отдельная удобна тем, что в ней по определению нет ничего ценного: таблицу от упавшего
      # процесса видно и не жалко удалить.
      ONECDC_DB_TEMP_SCHEMA: "onecdc_tmp"
      # Число фоновых потоков полной выгрузки (по умолчанию 2). Больше потоков — больше нагрузки
      # и на 1С, и на пул соединений к БД.
      ONECDC_FULL_LOAD_WORKERS: "2"
      # Объект, впервые пришедший в пакете изменений, сам встаёт на полную выгрузку (по умолчанию
      # true). false — репликатор только читает изменения: так ставят, когда первую загрузку
      # инициируют на стороне 1С. Помеченный руками объект выгружается в любом случае.
      ONECDC_AUTOMATIC_FULL_LOAD: "true"
      # Период опроса изменений в секундах (по умолчанию 60).
      ONECDC_POLL_INTERVAL: "60"
      # loop (по умолчанию) — вечный цикл; once — один цикл read → save → notify и выход.
      ONECDC_MODE: "loop"
      # DEBUG / INFO (по умолчанию) / WARNING / ERROR / CRITICAL.
      ONECDC_LOG_LEVEL: "INFO"
      # Сколько суток держать журнал загрузок onecdc_replicator_log (по умолчанию 30). Строка на
      # объект на пакет — это миллионы строк в год. 0 — хранить всё, уборка тогда ваша.
      ONECDC_LOG_RETENTION_DAYS: "30"
      # Путь к своему runner.py, если он назван иначе (по умолчанию /config/runner.py).
      # ONECDC_RUNNER: "/config/runner_cron.py"
      # Часовой пояс: расписания FullLoadCron считаются в локальном времени, а в контейнере это UTC.
      TZ: "Europe/Moscow"

    # Свой конфиг: runner.py + handlers/. Шаблон достаётся из самого образа:
    #   docker run --rm sobolevp/onecdc:latest tar c -C /opt/onecdc config | tar x
    # Тома нет — контейнер работает по переменным выше, без обработчиков и расписаний.
    # ro: конфиг читается и не должен меняться изнутри контейнера.
    volumes:
      - ./config:/config:ro

    # Раскомментируйте, если 1С или Postgres работают на этой же машине: у контейнера свой сетевой
    # стек, и localhost внутри него означает сам контейнер, а не хост.
    # network_mode: host

    # По SIGTERM цикл дорабатывает текущую итерацию и только потом выходит: подтверждение пакета
    # в 1С и незавершённые merge не должны обрываться. Не начатые полные выгрузки при этом
    # отменяются, а идущая прерывается на границе страницы — то есть ждать приходится одну
    # страницу, а не весь её прогон.
    #
    # Не хватило — docker добьёт SIGKILL, и это терпимо: брошенную строку реестра разберёт
    # следующий запуск (deliver_abandoned), а выгрузка идемпотентна и начнётся заново. Поднимать
    # это время «на всякий случай» незачем — оно лишь отодвигает тот же исход.
    stop_grace_period: 60s
