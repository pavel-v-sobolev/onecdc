name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    # Целевая СУБД у продукта — PostgreSQL, и тесты идут против неё же: каждый берёт свою схему
    # (см. tests/conftest.py). sqlite не подошёл бы — он отличается ровно в тех местах, которые
    # тесты и проверяют (схемы, точность CURRENT_TIMESTAMP, соединение = отдельная база).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: onecdc
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      # --locked: расхождение с uv.lock — отказ сборки, а не тихий пересчёт зависимостей.
      # Без него lock-файл лежит в репозитории, ничего не гарантируя: матрица тестов собиралась
      # бы каждый раз из «последних» версий.
      - run: uv sync --extra dev --locked
      # Тесты, которым нужна живая 1С, помечены integration и отсеиваются addopts из pyproject.
      # Postgres нужен всем остальным — его и поднимает services выше.
      - run: uv run pytest -q
        env:
          ONECDC_TEST_DB_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/onecdc

# Публикации здесь нет намеренно: пакет выкладывается руками, из чистой сборки.
#
#   rm -rf dist && uv build
#   uv publish dist/onecdc-<версия>* --token pypi-...
#
# Маска обязательна: в dist/ копятся артефакты прошлых версий, и публикация без неё спотыкается
# об уже выложенное.
