[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "onecdc"
version = "0.2.1"
description = "Change data capture (CDC) from 1C:Enterprise to your data warehouse"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "croniter>=6.0.0",
    "dbmerge>=1.0.22",
    "requests>=2.33.0",
    "sqlalchemy>=2.0.49",
    "xmltodict>=1.0.4",
]

keywords = [
    "1c", "1c-enterprise", "cdc", "data-engineering", "etl", "dwh", "python", "postgres"
]

authors = [
  { name="Pavel Sobolev", email="pavel-v-sobolev@yandex.ru" },
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.12",
]
dev = [
    "pytest>=8",
    # Тесты идут против локального PostgreSQL (см. tests/conftest.py), поэтому драйвер входит
    # в dev-окружение, а не ставится отдельно.
    "onecdc[postgres]",
]

[project.scripts]
onecdc = "onecdc.__main__:main"

[project.urls]
Homepage = "https://github.com/pavel-v-sobolev/onecdc"
Repository = "https://github.com/pavel-v-sobolev/onecdc"
Issues = "https://github.com/pavel-v-sobolev/onecdc/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень репозитория в sys.path: тесты обработчиков импортируют config.handlers, чтобы
# примеры не разъезжались с контрактом молча.
pythonpath = ["."]
# По умолчанию не гоняем тесты, которым нужна живая 1С. Postgres нужен всем тестам без
# исключения (см. tests/conftest.py), маркером это не отсекается.
addopts = "-m 'not integration'"
markers = [
    "integration: требует живого сервера 1С (параметры из tests/test_cdc_run_once.py)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onecdc"]
