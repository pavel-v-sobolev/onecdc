[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "onecdc"
version = "1.1.0"
description = "Change data capture (CDC) from 1C:Enterprise to your data warehouse"
readme = "README.md"
requires-python = ">=3.10"

# Только нижние границы: верхняя по мажорной версии не давала поставить новую версию зависимости
# рядом с onecdc, даже когда она совместима. Совместимость с новыми версиями проверяют тесты
# (uv sync --upgrade), а точный проверенный набор зафиксирован в uv.lock.
dependencies = [
    "croniter>=6.0.0",
    "dbmerge>=2.1.1",
    "requests>=2.33.0",
    "sqlalchemy>=2.0.49",
    "xmltodict>=1.0.4",
]

keywords = [
    "1c", "1c-enterprise", "cdc", "data-engineering", "etl", "dwh", "python", "postgres"
]

authors = [
  { name="Pavel Sobolev", email="pavel-v-sobolev@yandex.ru" },
]

license = "MIT"
license-files = ["LICEN[CS]E*"]

classifiers = [
    # Версия говорит про API, классификатор — про зрелость. С 1.1.0 продукт объявлен
    # продуктивным: ядро отработано на живых базах, аудит 0.2.1 разобран полностью.
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
postgres = [
    "psycopg2-binary>=2.9.12",
]
# Витрины в ClickHouse (config/handlers/*_clickhouse.py): репликатор пишет в PostgreSQL, а ClickHouse
# читает его таблицы сам, через базу с движком PostgreSQL. Драйвер — clickhouse-connect:
# clickhouse-sqlalchemy dbmerge не принимает (его драйвер открывает сессию на каждый оператор,
# и временная таблица теряется).
clickhouse = [
    "dbmerge[clickhouse]>=2.1.1",
]
dev = [
    "pytest>=8",
    # Порядок тестов случайный не для красоты: тесты работают с общей БД и поднимают фоновые
    # потоки отметки живости, поэтому зависимость одного теста от следов другого — реальный
    # класс дефекта. Плавающее падение «мёртвый процесс продлил свою строку» нашлось именно
    # так, и воспроизводилось только при определённом порядке.
    "pytest-randomly>=3.15",
    # Тесты идут против локального PostgreSQL (см. tests/conftest.py), поэтому драйвер входит
    # в dev-окружение, а не ставится отдельно.
    "onecdc[postgres]",
    # Примеры витрин в ClickHouse проверяются против локального сервера; без него их тесты
    # пропускаются (см. tests/test_clickhouse_handlers.py).
    "onecdc[clickhouse]",
]

[project.scripts]
onecdc = "onecdc.__main__:main"

[project.urls]
Homepage = "https://github.com/pavel-v-sobolev/onecdc"
Repository = "https://github.com/pavel-v-sobolev/onecdc"
Issues = "https://github.com/pavel-v-sobolev/onecdc/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень репозитория в sys.path: тесты обработчиков импортируют config.handlers, чтобы
# примеры не разъезжались с контрактом молча.
pythonpath = ["."]
# По умолчанию исключены тесты с реальным сервером 1С. Тесты с фикстурой db используют
# PostgreSQL (см. tests/conftest.py); этот маркер их не исключает.
addopts = "-m 'not integration'"
markers = [
    "integration: требует живого сервера 1С (параметры из tests/test_cdc_run_once.py)",
]

[tool.hatch.build.targets.wheel]
packages = ["src/onecdc"]
